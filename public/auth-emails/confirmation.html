<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirm your Hidayat account</title>
  </head>
  <body style="margin:0;background:#f8f9fb;font-family:Arial,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e2e5eb;border-radius:16px;">
            <tr>
              <td style="padding:40px;text-align:center;">
                <h1 style="margin:0 0 16px;color:#18593a;font-size:26px;">Confirm your email address</h1>
                <p style="margin:0 0 24px;color:#6b7280;font-size:16px;line-height:1.6;">
                  Verify your email to finish creating your Hidayat account.
                </p>
                <a href="https://hidayat.pk/auth/callback?token_hash={{ .TokenHash }}&amp;type=signup"
                   style="display:inline-block;background:#2d8659;color:#ffffff;text-decoration:none;font-weight:700;padding:13px 24px;border-radius:8px;">
                  Verify my email
                </a>
                <p style="margin:28px 0 0;color:#9ba2b0;font-size:12px;line-height:1.5;">
                  If you did not create this account, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
